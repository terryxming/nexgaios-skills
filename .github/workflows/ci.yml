name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 安装 skill 级 lint 依赖（skills-ref，桶一）
        run: pip install -r tools/requirements.txt
      - name: 仓库级 + skill 级 lint（W1 三项 + W2 桶一/桶二）
        run: python tools/lint.py
