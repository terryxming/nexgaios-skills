# /new-skill 触发评测用例（承纪律 F）。
# 判定：headless 子会话跑 prompt，看输出里是否出现 new-skill 的 Skill 工具调用。
# category：显式 / 隐式 / 情境 / 负例。负例误触发是重点，全局底线要求为 0。
cases:
  - id: explicit-create
    should_trigger: true
    category: 显式
    prompt: "在这个仓库帮我新建一个 skill，名字叫 data-export"

  - id: implicit-pipeline
    should_trigger: true
    category: 隐式
    prompt: "我想给这条 skill 流水线从零加一条新能力，先把骨架搭出来"

  - id: contextual-scaffold
    should_trigger: true
    category: 情境
    prompt: "参考现有 skill 的结构，scaffold 一个新的 skill 目录出来"

  - id: negative-modify-existing
    should_trigger: false
    category: 负例
    prompt: "把现有 new-skill 的 description 改得更清楚一点"

  - id: negative-general-code
    should_trigger: false
    category: 负例
    prompt: "帮我写一个 Python 函数，计算斐波那契数列的第 n 项"

  - id: negative-concept-question
    should_trigger: false
    category: 负例
    prompt: "解释一下 Agent Skills 规范里 description 字段的长度限制是多少"
